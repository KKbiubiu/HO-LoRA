name: Code, documentation or result issue
description: Report a core implementation error, documentation issue or result discrepancy.
title: "[Report] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Identify the file, table row or claim and the expected correction.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and reproduction
      description: Include public evidence or commands. Do not upload private data or credentials.
    validations:
      required: true
