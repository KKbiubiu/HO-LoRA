name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  results:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python tools/summarize_results.py --check
      - run: python -m unittest discover -s tests -p test_results.py -v
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-core.txt
      - run: python -m pip install torch==2.1.0 torchvision==0.16.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-core.txt
      - run: python -m unittest discover -s tests -p 'test_*_core.py' -v
        env:
          OMP_NUM_THREADS: '1'
          PYTHONWARNDEFAULTENCODING: '1'
